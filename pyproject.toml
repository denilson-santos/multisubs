[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multisubs"
dynamic = ["version"]
description = "A tool to generate and embed subtitles into videos."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "Pillow>=12,<13",
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
    "whisperx==3.8.6",
    "ffmpeg-python",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pyright>=1.1,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "twine>=6,<7",
]

[project.scripts]
multisubs = "multisubs.cli:main"

[tool.setuptools.dynamic]
version = {attr = "multisubs.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: test that requires a local external integration such as FFmpeg or WhisperX",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["multisubs", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
