[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multisubs"
version = "0.1.0"
description = "A tool to generate and embed subtitles into videos."
requires-python = ">=3.10"
dependencies = [
    "openai-whisper",
    "ffmpeg-python",
]

[project.scripts]
multisubs = "multisubs.cli:main"
