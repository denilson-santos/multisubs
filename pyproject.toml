[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multisubs"
dynamic = ["version"]
description = "A tool to generate and embed subtitles into videos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "Pillow>=12,<13",
    "ffmpeg-python",
    "fonttools>=4.63,<5",
    "uniseg==0.10.1",
    "SudachiPy==0.6.11",
    "SudachiDict-small==20260723",
    "jieba==0.42.1",
    "typer>=0.27.2,<0.28",
]

[project.optional-dependencies]
whisperx = [
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
    "whisperx==3.8.6",
]
faster-whisper = [
    "faster-whisper>=1.2,<2",
]
parakeet = [
    "torch~=2.8.0",
    "nemo-toolkit[asr]>=2.4,<3",
]
qwen = [
    "torch~=2.8.0",
    "transformers>=5.13,<6",
    "accelerate>=1.10,<2",
    "librosa>=0.11,<1",
    "nagisa>=0.2,<0.3",
    "soynlp>=0.0.493,<0.1",
]
asr-all = [
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
    "whisperx==3.8.6",
    "faster-whisper>=1.2,<2",
    "nemo-toolkit[asr]>=2.4,<3",
    "transformers>=5.13,<6",
    "accelerate>=1.10,<2",
    "librosa>=0.11,<1",
    "nagisa>=0.2,<0.3",
    "soynlp>=0.0.493,<0.1",
]
dev = [
    "build>=1.2,<2",
    "pyright>=1.1,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "twine>=6,<7",
]

[project.scripts]
multisubs = "multisubs.cli:main"

[tool.setuptools.dynamic]
version = {attr = "multisubs.__version__"}

[tool.setuptools.package-data]
multisubs = [
    "assets/fonts/manifest.json",
    "assets/fonts/*/OFL.txt",
    "assets/fonts/*/*.otf",
    "assets/fonts/*/*.ttf",
    "assets/templates/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: test that requires a local external integration such as FFmpeg or an ASR runtime",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["multisubs", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
