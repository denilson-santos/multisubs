name: Production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full staged SHA to verify without publishing a release
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-${{ github.ref_name || inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve-production-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.context.outputs.target_sha }}
      package_version: ${{ steps.context.outputs.package_version }}
      artifact_name: ${{ steps.context.outputs.artifact_name }}
      staging_run_id: ${{ steps.artifact.outputs.staging_run_id }}
      staging_source_sha: ${{ steps.staging-run.outputs.staging_source_sha }}
      release_tag: ${{ steps.context.outputs.release_tag }}
      publish_release: ${{ steps.context.outputs.publish_release }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the production context
        id: context
        env:
          DISPATCH_SHA: ${{ inputs.commit_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" = "push" ]]; then
            target_sha="$(git rev-parse "${EVENT_SHA}^{commit}")"
            release_tag="${REF_NAME}"
            publish_release=true
          else
            target_sha="${DISPATCH_SHA}"
            release_tag=""
            publish_release=false
          fi
          if [[ ! "${target_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character SHA" >&2
            exit 1
          fi
          git cat-file -e "${target_sha}^{commit}"
          git merge-base --is-ancestor "${target_sha}" origin/main
          git checkout --detach "${target_sha}"
          package_version="$(python -c 'from multisubs import __version__; print(__version__)')"
          if [[ "${publish_release}" = "true" ]]; then
            python .github/scripts/release.py validate-tag \
              --tag "${release_tag}" --version "${package_version}"
          fi
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=staging-${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${publish_release}" >> "${GITHUB_OUTPUT}"

      - name: Locate the exact staging artifact
        id: artifact
        env:
          ARTIFACT_NAME: ${{ steps.context.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            | python .github/scripts/release.py select-artifact \
                --name "${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Validate the owning staging run
        id: staging-run
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ steps.artifact.outputs.staging_run_id }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        run: |
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_RUN_ID}" \
            | python .github/scripts/release.py validate-staging-run \
                --repository "${GITHUB_REPOSITORY}" \
                --sha "${TARGET_SHA}" >> "${GITHUB_OUTPUT}"

  verify:
    name: verify-production-artifact
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          persist-credentials: false

      - name: Download the staging artifact without rebuilding it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.staging_run_id }}

      - name: Validate the distribution file set
        run: >-
          python .github/scripts/release.py validate-dist
          --directory dist
          --version "${{ needs.resolve.outputs.package_version }}"

      - name: Verify distribution checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Verify staging provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: github.com/${{ github.repository }}/.github/workflows/_verify.yml
          STAGING_SOURCE_SHA: ${{ needs.resolve.outputs.staging_source_sha }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/SHA256SUMS; do
            gh attestation verify "${artifact}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${SIGNER_WORKFLOW}" \
              --signer-digest "${STAGING_SOURCE_SHA}" \
              --source-digest "${STAGING_SOURCE_SHA}" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done

      - name: Pass verified files to the release job
        if: needs.resolve.outputs.publish_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ needs.resolve.outputs.target_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: publish-github-release
    needs: [resolve, verify]
    if: needs.resolve.outputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release validation helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          persist-credentials: false

      - name: Download the verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-${{ needs.resolve.outputs.target_sha }}
          path: dist

      - name: Create or safely resume the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          if gh release view "${RELEASE_TAG}" \
            --json tagName,isDraft,body > "${RUNNER_TEMP}/release.json" 2>/dev/null; then
            python .github/scripts/release.py validate-draft \
              --tag "${RELEASE_TAG}" --sha "${TARGET_SHA}" \
              < "${RUNNER_TEMP}/release.json"
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --draft \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes "Source SHA: ${TARGET_SHA}" \
              --generate-notes
          fi

      - name: Require the exact verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          gh release view "${RELEASE_TAG}" --json assets \
            | python .github/scripts/release.py validate-assets \
                $(find dist -maxdepth 1 -type f -printf '%f\n' | sort)

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest
