name: Shared verification

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      run_integration:
        default: false
        type: boolean
      publish_artifact:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the CPU PyTorch set
        run: >-
          python -m pip install --disable-pip-version-check
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
          --prefer-binary
          torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0

      - name: Install multisubs and development checks
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Compile package modules
        run: python -m compileall multisubs

      - name: Check formatting
        if: matrix.python-version == '3.10'
        run: python -m ruff format --check .

      - name: Lint source and tests
        if: matrix.python-version == '3.10'
        run: python -m ruff check .

      - name: Check types
        if: matrix.python-version == '3.10'
        run: python -m pyright

      - name: Run hermetic tests
        run: python -m pytest

      - name: Install FFmpeg for integration tests
        if: inputs.run_integration && matrix.python-version == '3.10'
        run: |
          sudo sed -i \
            's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Report FFmpeg versions
        if: inputs.run_integration && matrix.python-version == '3.10'
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run FFmpeg and libass integration tests
        if: inputs.run_integration && matrix.python-version == '3.10'
        run: python -m pytest -m integration

      - name: Build distribution artifacts
        if: matrix.python-version == '3.10'
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        if: inputs.publish_artifact && matrix.python-version == '3.10'
        run: |
          python -m venv "${RUNNER_TEMP}/multisubs-wheel-smoke"
          "${RUNNER_TEMP}/multisubs-wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            --prefer-binary \
            torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0
          "${RUNNER_TEMP}/multisubs-wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check dist/*.whl
          "${RUNNER_TEMP}/multisubs-wheel-smoke/bin/multisubs" --help

      - name: Create distribution checksum manifest
        if: inputs.publish_artifact && matrix.python-version == '3.10'
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz > SHA256SUMS

      - name: Pass the staging build to the staging workflow
        if: inputs.publish_artifact && matrix.python-version == '3.10'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-build-${{ inputs.target_sha }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
