name: Shared verification

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      run_integration:
        default: false
        type: boolean
      publish_artifact:
        default: false
        type: boolean
      artifact_name:
        default: ""
        type: string

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the CPU PyTorch set
        run: >-
          python -m pip install --disable-pip-version-check
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0

      - name: Install multisubs and development checks
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Compile package modules
        run: python -m compileall multisubs

      - name: Check formatting
        if: matrix.python-version == '3.10'
        run: python -m ruff format --check .

      - name: Lint source and tests
        if: matrix.python-version == '3.10'
        run: python -m ruff check .

      - name: Check types
        if: matrix.python-version == '3.10'
        run: python -m pyright

      - name: Run hermetic tests
        run: python -m pytest

      - name: Report FFmpeg versions
        if: inputs.run_integration && matrix.python-version == '3.10'
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run FFmpeg and libass integration tests
        if: inputs.run_integration && matrix.python-version == '3.10'
        run: python -m pytest -m integration

      - name: Build distribution artifacts
        if: matrix.python-version == '3.10'
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        if: inputs.publish_artifact && matrix.python-version == '3.10'
        run: |
          python -m venv "${RUNNER_TEMP}/multisubs-wheel-smoke"
          "${RUNNER_TEMP}/multisubs-wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0
          "${RUNNER_TEMP}/multisubs-wheel-smoke/bin/python" -m pip install \
            --disable-pip-version-check dist/*.whl
          "${RUNNER_TEMP}/multisubs-wheel-smoke/bin/multisubs" --help

      - name: Create distribution checksum manifest
        if: inputs.publish_artifact && matrix.python-version == '3.10'
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz > SHA256SUMS

      - name: Pass the staging build to the publication job
        if: inputs.publish_artifact && matrix.python-version == '3.10'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-build-${{ inputs.target_sha }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish verified staging artifact
    if: inputs.publish_artifact
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-build-${{ inputs.target_sha }}-${{ github.run_id }}
          path: dist

      - name: Attest staging artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Upload immutable staging artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
